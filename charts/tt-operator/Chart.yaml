apiVersion: v2
name: tt-operator
description: Umbrella chart for Tenstorrent on Kubernetes. Installs NFD for device labelling and tt-k8s-driver-manager for tt-kmd, firmware, and tt-smi lifecycle.
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  - name: node-feature-discovery
    version: "0.18.3"
    repository: "https://kubernetes-sigs.github.io/node-feature-discovery/charts"
    condition: node-feature-discovery.enabled
  - name: tt-k8s-driver-manager
    version: "0.1.0"
    repository: "oci://ghcr.io/tenstorrent/helm-charts"
    condition: tt-k8s-driver-manager.enabled
