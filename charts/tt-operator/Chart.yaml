apiVersion: v2
name: tt-operator
description: Umbrella chart for Tenstorrent on Kubernetes. Installs NFD for device labelling, tt-k8s-driver-manager for tt-kmd, firmware, and tt-smi lifecycle, and optionally tt-fabric-manager for cluster fabric/interconnect management.
type: application
# Sentinel values — overwritten by .github/workflows/helm-release.yaml at
# publish time. On main pushes the chart is published as
# <next-patch>-<run>.sha-<short>; on a v*.*.* tag push it's the tag itself.
# Keep these as 0.0.0 in source so a stray local `helm package` doesn't
# silently land in a real release lane.
version: 0.0.0
appVersion: "0.0.0"
dependencies:
  - name: node-feature-discovery
    version: "0.18.3"
    repository: "https://kubernetes-sigs.github.io/node-feature-discovery/charts"
    condition: node-feature-discovery.enabled
  - name: tt-k8s-driver-manager
    version: "0.1.0"
    repository: "oci://ghcr.io/tenstorrent/helm-charts"
    condition: tt-k8s-driver-manager.enabled
  # Tenstorrent Fabric Manager (TTFM): per-node agent + cluster controller
  # owning inter-card / inter-host fabric topology. Opt-in; most single-node
  # / non-Galaxy setups don't need it. Aliased to `tt-fabric-manager` so
  # values keys + rendered resources use the descriptive name instead of
  # the short upstream chart name `ttfm`.
  # Source: github.com/tenstorrent/tt-fabric-manager
  - name: ttfm
    alias: tt-fabric-manager
    version: "0.2.27-153.sha-07c9edd"
    repository: "oci://ghcr.io/tenstorrent/ttfm-helm"
    condition: tt-fabric-manager.enabled
