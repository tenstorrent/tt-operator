apiVersion: v2
name: tt-operator
description: Umbrella chart for Tenstorrent on Kubernetes. Installs NFD, tt-k8s-driver-manager, the Fabric Manager (topology service), and the DRA driver.
type: application
version: 0.4.0
appVersion: "0.4.0"
dependencies:
  - name: node-feature-discovery
    version: "0.18.3"
    repository: "https://kubernetes-sigs.github.io/node-feature-discovery/charts"
    condition: node-feature-discovery.enabled

  - name: tt-k8s-driver-manager
    version: "0.3.0"
    repository: "oci://ghcr.io/tenstorrent/helm-charts"
    condition: tt-k8s-driver-manager.enabled

  # Tenstorrent Fabric Manager (TTFM): per-node agent + cluster controller
  # that owns inter-card / inter-host fabric topology + acts as the
  # discovery RPC source for downstream consumers (tt-dra-driver).
  # Source: github.com/tenstorrent/tt-fabric-manager
  - name: ttfm
    alias: tt-fabric-manager
    version: "0.2.26"
    repository: "oci://ghcr.io/tenstorrent/ttfm-helm"
    condition: tt-fabric-manager.enabled

  # DRA driver — Dynamic Resource Allocation kubelet plugin advertising
  # Tenstorrent ASICs through the k8s 1.33+ DRA API. Depends on TTFM
  # (queries the per-node agent's GetTopology RPC).
  # Source: github.com/tenstorrent/tt-dra-driver
  #
  # TODO: uncomment + pin a real version once tt-dra-driver publishes
  # its chart to oci://ghcr.io/tenstorrent/helm/. As of 2026-05-22 no
  # version is pullable from that path; leaving the entry commented
  # keeps `helm dep build` working out-of-the-box.
  #
  # - name: tt-dra-driver
  #   version: "0.1.0"
  #   repository: "oci://ghcr.io/tenstorrent/helm"
  #   condition: tt-dra-driver.enabled
