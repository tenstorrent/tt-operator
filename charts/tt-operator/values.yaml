# tt-operator is an umbrella chart. It installs:
#   - node-feature-discovery (so Tenstorrent nodes get the
#     feature.node.kubernetes.io/pci-1200_1e52.present label)
#   - tt-k8s-driver-manager (controllers + CRDs + images for tt-kmd, firmware,
#     and tt-smi lifecycle — see github.com/tenstorrent/tt-k8s-driver-manager)
#   - tt-fabric-manager (cluster fabric/interconnect manager — see
#     github.com/tenstorrent/tt-fabric-manager)
#   - tt-dra-driver (DRA kubelet plugin publishing Tenstorrent devices
#     as ResourceSlices — see github.com/tenstorrent/tt-dra-driver)
#   - tt-telemetry (collects device telemetry, exports Prometheus metrics +
#     web GUI — see github.com/tenstorrent/tt-telemetry)
#   - jobset (kubernetes-sigs/jobset; grouped Job lifecycle used by
#     multi-node training workloads)
#   - kubepmix (mutating webhook injecting PMIx env into multi-node
#     training Jobs; requires cert-manager pre-installed)
#
# Everything below is wired into one of the subcharts.
#
# Note for editors: the `# --` lines are helm-docs annotations that feed the
# generated charts/tt-operator/README.md values table. The longer prose above
# each one is for source readers and is not pulled into the table. After
# editing values here, run `make docs` and commit the regenerated README — CI
# fails if it is stale.

node-feature-discovery:
  # -- (bool) Install node-feature-discovery so Tenstorrent nodes get the feature.node.kubernetes.io/pci-1200_1e52.present label.
  enabled: true
  # Restrict NFD to the PCI source only. All we need is the
  # pci-<class>_<vendor>.present label for Tenstorrent devices — running
  # the full set (cpu, memory, kernel, system, storage, network, usb, custom)
  # costs CPU/memory on every node and clutters node labels.
  worker:
    config:
      core:
        # -- (list) NFD feature sources to enable. Restricted to PCI — the only source needed to detect Tenstorrent devices.
        featureSources: ["pci"]
        # -- (list) NFD label sources to enable. Restricted to PCI to avoid the CPU/memory cost and label clutter of the full source set.
        labelSources: ["pci"]
    # NFD worker must reach every node — including ones tainted for team
    # / tenant isolation — or the `pci-1200_1e52.present` label never
    # lands and the firmware / driver policy controllers never match.
    # Matches the universal-toleration pattern used by NVIDIA gpu-operator,
    # Calico, node-exporter, etc. for system DaemonSets.
    # -- (list) Tolerations for the NFD worker DaemonSet. Defaults to universal so the PCI label reaches tainted node pools.
    tolerations:
      - operator: Exists

# tt-k8s-driver-manager owns the controllers, CRDs, and per-node images that
# manage tt-kmd installation, firmware flashing, and tt-smi userspace.
# Set tt-k8s-driver-manager.enabled=false to opt out (e.g. if you only want
# NFD labelling and intend to manage drivers some other way).
tt-k8s-driver-manager:
  # -- (bool) Install tt-k8s-driver-manager (controllers, CRDs, and per-node images for tt-kmd, firmware flashing, and tt-smi). Disable to manage drivers yourself.
  enabled: true

# tt-fabric-manager (TTFM) owns inter-card / inter-host fabric topology and
# exposes a GetTopology gRPC consumed by downstream allocators (e.g.
# tt-dra-driver). Opt-in because most single-node / non-Galaxy setups
# don't need it.
#
# Before setting enabled: true, an admin should plan to override at least:
#   - imagePullSecrets: point at the GHCR pull secret available in your
#     cluster.
#   - fabric_manager_config.groups: list your cluster's actual node
#     hostnames; the agents won't match otherwise.
#   - ingress.enabled / ingress.host: review whether ingress fits your
#     environment, and retarget the hostname if so.
tt-fabric-manager:
  # -- (bool) Install tt-fabric-manager (TTFM): inter-card/inter-host fabric topology + GetTopology gRPC. Opt-in; most single-node / non-Galaxy setups don't need it.
  enabled: true
  # Drop the umbrella's release prefix so Service names render as
  # `tt-fabric-manager-{controller,agent}` instead of
  # `tt-operator-tt-fabric-manager-{controller,agent}`. Matches cert-manager
  # / NVIDIA-GPU-operator naming (platform component, not release identity).
  # -- (string) Drop the release prefix so TTFM Service names render as tt-fabric-manager-{controller,agent}.
  fullnameOverride: tt-fabric-manager

# tt-dra-driver is a per-node kubelet plugin that publishes Tenstorrent
# devices as DRA ResourceSlices. Opt-in. Before setting enabled: true,
# the admin must satisfy these prerequisites:
#   - k8s 1.33+ on every node (subchart's kubeVersion is tighter than the
#     umbrella's >=1.27.0-0).
#   - tt-fabric-manager.enabled: true — the DRA driver discovers devices
#     by calling TTFM's GetTopology gRPC, and won't publish slices without
#     a TTFM agent on each node.
#   - DynamicResourceAllocation feature gate enabled on kube-apiserver and
#     kubelet on every node (DRA is GA in 1.34, feature-gated in 1.33).
tt-dra-driver:
  # -- (bool) Install tt-dra-driver (DRA kubelet plugin publishing devices as ResourceSlices). Requires k8s 1.33+, tt-fabric-manager.enabled, and the DynamicResourceAllocation feature gate.
  enabled: true

  # Point at the in-cluster TTFM agent Service. Subchart default is
  # `ttfm-agent.ttfm.svc.cluster.local:50053`, which references the
  # upstream chart's pre-fullnameOverride Service name + a separate
  # `ttfm` namespace — neither matches what this umbrella deploys
  # (`tt-fabric-manager-agent` in the release namespace). The agent
  # Service uses `internalTrafficPolicy: Local`, so DNS resolves to the
  # local node's agent pod.
  kubeletPlugin:
    # -- (string) Address of the in-cluster TTFM agent Service the DRA plugin calls for GetTopology.
    fabricManagerAgentAddress: tt-fabric-manager-agent.tt-operator-system.svc.cluster.local:50053

# tt-telemetry collects Tenstorrent device telemetry and exports it via a
# Prometheus HTTP endpoint and a simple web GUI. Alpha software.
#
# Namespace consolidation: tt-telemetry's chart hardcodes its install
# namespace via .Values.namespace (no Release.Namespace fallback in the
# template). We override it here so the Deployment/DaemonSet/Service land
# alongside the rest of tt-operator instead of in a dedicated
# `tt-telemetry` namespace. If you install the umbrella into a namespace
# other than `tt-operator-system`, override this value to match — e.g.
#   helm install ... -n my-ns --set tt-telemetry.namespace=my-ns
# (podMonitor.namespace is intentionally left at upstream default
# `monitoring`, where Prometheus typically scrapes from.)
tt-telemetry:
  # -- (bool) Install tt-telemetry (device telemetry → Prometheus endpoint + web GUI). Alpha software.
  enabled: true
  # -- (string) Namespace for tt-telemetry resources. The subchart hardcodes this (no Release.Namespace fallback), so match your install namespace.
  namespace: tt-operator-system

  # Pin the published org-namespace image. The subchart's own default
  # still points at a personal-namespace dev `:latest` tag, which
  # leaks into umbrella consumers if not overridden here. Keep the tag
  # in lockstep with the tt-telemetry subchart version in Chart.yaml.
  image:
    # -- (string) tt-telemetry image repository, pinned to the published org-namespace image.
    repository: ghcr.io/tenstorrent/tt-telemetry
    # -- (string) tt-telemetry image tag. Keep in lockstep with the tt-telemetry subchart version in Chart.yaml.
    tag: "0.1.1"

  # Scope the collector DaemonSet to TT-equipped nodes AND let operators
  # drain it from a single node by flipping the deploy-gate label —
  # NVIDIA gpu-operator pattern (see `nvidia.com/gpu.deploy.dcgm-exporter`).
  # The DS controller terminates the per-node pod when its nodeAffinity
  # stops matching, so flipping `tenstorrent.com/deploy.tt-telemetry=false`
  # on a node drains telemetry there without touching the DS as a whole.
  # Absent or "true" keeps scheduling; only an explicit "false" drains.
  #
  # `pci-1200_1e52.present` is applied by NFD (umbrella default), which we
  # rely on as the canonical "Tenstorrent-equipped node" signal.
  # -- (object) Collector DaemonSet nodeAffinity — schedule on TT-equipped nodes and honor the tenstorrent.com/deploy.tt-telemetry drain gate.
  daemonset:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: feature.node.kubernetes.io/pci-1200_1e52.present
                  operator: In
                  values: ["true"]
                - key: tenstorrent.com/deploy.tt-telemetry
                  operator: NotIn
                  values: ["false"]

# JobSet (kubernetes-sigs/jobset) groups related Jobs into a single
# managed unit; used by multi-node training workloads on Tenstorrent
# hardware. No external prereqs.
#
# Note: the upstream jobset chart hardcodes `.Release.Namespace` in its
# templates, so its resources always land in the umbrella's install
# namespace. There's no per-subchart namespace knob to expose here without
# forking jobset upstream.
jobset:
  # -- (bool) Install JobSet (kubernetes-sigs/jobset) for grouped multi-node Job lifecycle. No external prereqs.
  enabled: true

# kubepmix is a mutating webhook that injects PMIx env vars into Jobs
# launched on Tenstorrent multi-node training runs. Requires cert-manager
# pre-installed on the cluster — the webhook's TLS cert is issued via
# cert-manager Issuer + Certificate resources.
#
# `kubepmix.namespace` controls where the webhook's Deployment, Service,
# Issuer, and Certificate land. Defaults to a dedicated `kube-pmix`
# namespace (matches upstream's convention and keeps the webhook
# discoverable as shared infra). Set to `.Release.Namespace` to
# consolidate alongside the rest of tt-operator instead:
#   --set kubepmix.namespace=tt-operator-system
# The chart creates the namespace if it differs from the release ns;
# otherwise it reuses the existing one.
kubepmix:
  # -- (bool) Install the kubepmix mutating webhook (injects PMIx env into multi-node training Jobs). Requires cert-manager pre-installed.
  enabled: true
  # -- (string) Namespace for the kubepmix webhook resources. Defaults to a dedicated kube-pmix namespace; set to your release namespace to consolidate.
  namespace: kube-pmix
