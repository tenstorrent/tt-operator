# tt-operator is an umbrella chart. It installs:
#   - node-feature-discovery (so Tenstorrent nodes get the
#     feature.node.kubernetes.io/pci-1200_1e52.present label)
#   - tt-k8s-driver-manager (controllers + CRDs + images for tt-kmd, firmware,
#     and tt-smi lifecycle — see github.com/tenstorrent/tt-k8s-driver-manager)
#   - tt-fabric-manager (cluster fabric/interconnect manager — see
#     github.com/tenstorrent/tt-fabric-manager)
#   - tt-dra-driver (DRA kubelet plugin publishing Tenstorrent devices
#     as ResourceSlices — see github.com/tenstorrent/tt-dra-driver)
#   - tt-telemetry (collects device telemetry, exports Prometheus metrics +
#     web GUI — see github.com/tenstorrent/tt-telemetry)
#   - jobset (kubernetes-sigs/jobset; grouped Job lifecycle used by
#     multi-node training workloads)
#   - kubepmix (mutating webhook injecting PMIx env into multi-node
#     training Jobs; requires cert-manager pre-installed)
#
# Everything below is wired into one of the subcharts.

node-feature-discovery:
  enabled: true
  # Restrict NFD to the PCI source only. All we need is the
  # pci-<class>_<vendor>.present label for Tenstorrent devices — running
  # the full set (cpu, memory, kernel, system, storage, network, usb, custom)
  # costs CPU/memory on every node and clutters node labels.
  worker:
    config:
      core:
        featureSources: ["pci"]
        labelSources:   ["pci"]

# tt-k8s-driver-manager owns the controllers, CRDs, and per-node images that
# manage tt-kmd installation, firmware flashing, and tt-smi userspace.
# Set tt-k8s-driver-manager.enabled=false to opt out (e.g. if you only want
# NFD labelling and intend to manage drivers some other way).
tt-k8s-driver-manager:
  enabled: true
  # Image tags track the driver-manager :latest published from main.
  # Switch to :0.1.0 once a v0.1.0 git tag is cut on tt-k8s-driver-manager
  # (the images workflow only produces semver tags from git tags, not from
  # chart-version reads).
  controller:
    image: ghcr.io/tenstorrent/tt-k8s-driver-manager-controller:latest
  # `driver.image` is the per-node builder image (clones tt-kmd, builds
  # against host kernel headers, insmods). Pre-pivot name was -installer;
  # the abandoned :dev tag of that older image is also gone.
  driver:
    image: ghcr.io/tenstorrent/tt-k8s-driver-manager-builder:latest
  flasher:
    image: ghcr.io/tenstorrent/tt-k8s-driver-manager-flasher:latest

# tt-fabric-manager (TTFM) owns inter-card / inter-host fabric topology and
# exposes a GetTopology gRPC consumed by downstream allocators (e.g.
# tt-dra-driver). Opt-in because most single-node / non-Galaxy setups
# don't need it.
#
# Before setting enabled: true, an admin should plan to override at least:
#   - imagePullSecrets: point at the GHCR pull secret available in your
#     cluster.
#   - fabric_manager_config.groups: list your cluster's actual node
#     hostnames; the agents won't match otherwise.
#   - ingress.enabled / ingress.host: review whether ingress fits your
#     environment, and retarget the hostname if so.
tt-fabric-manager:
  enabled: true

# tt-dra-driver is a per-node kubelet plugin that publishes Tenstorrent
# devices as DRA ResourceSlices. Opt-in. Before setting enabled: true,
# the admin must satisfy these prerequisites:
#   - k8s 1.33+ on every node (subchart's kubeVersion is tighter than the
#     umbrella's >=1.27.0-0).
#   - tt-fabric-manager.enabled: true — the DRA driver discovers devices
#     by calling TTFM's GetTopology gRPC, and won't publish slices without
#     a TTFM agent on each node.
#   - DynamicResourceAllocation feature gate enabled on kube-apiserver and
#     kubelet on every node (DRA is GA in 1.34, feature-gated in 1.33).
tt-dra-driver:
  enabled: true

# tt-telemetry collects Tenstorrent device telemetry and exports it via a
# Prometheus HTTP endpoint and a simple web GUI. Alpha software.
#
# Namespace consolidation: tt-telemetry's chart hardcodes its install
# namespace via .Values.namespace (no Release.Namespace fallback in the
# template). We override it here so the Deployment/DaemonSet/Service land
# alongside the rest of tt-operator instead of in a dedicated
# `tt-telemetry` namespace. If you install the umbrella into a namespace
# other than `tt-operator-system`, override this value to match — e.g.
#   helm install ... -n my-ns --set tt-telemetry.namespace=my-ns
# (podMonitor.namespace is intentionally left at upstream default
# `monitoring`, where Prometheus typically scrapes from.)
tt-telemetry:
  enabled: true
  namespace: tt-operator-system

# JobSet (kubernetes-sigs/jobset) groups related Jobs into a single
# managed unit; used by multi-node training workloads on Tenstorrent
# hardware. No external prereqs.
jobset:
  enabled: true

# kubepmix is a mutating webhook that injects PMIx env vars into Jobs
# launched on Tenstorrent multi-node training runs. Requires cert-manager
# pre-installed on the cluster — the webhook's TLS cert is issued via
# cert-manager Issuer + Certificate resources.
kubepmix:
  enabled: true
