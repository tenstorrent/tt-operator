suite: tt-k8s-driver-manager (umbrella consumption contract)
# Black-box contract for how the umbrella deploys the tt-k8s-driver-manager
# subchart (pulled from OCI — no source in this repo). Every other subchart is
# disabled: that keeps the render small and, importantly, avoids tt-dra-driver's
# k8s>=1.33 kubeVersion floor tripping the whole-chart render under
# helm-unittest's default capabilities.
#
# Each test is scoped to a specific subchart template with `template:` —
# helm-unittest evaluates document assertions per-template, so an unscoped
# "contains a Deployment" check would fail against the RBAC template. The
# subchart renders ONLY the controller Deployment + RBAC at install time; the
# per-node installer DaemonSet is created at runtime by the controller, and the
# driver/flasher images are passed to it via the DRIVER_IMAGE / FLASHER_IMAGE
# env vars on the controller's manager container.
release:
  name: tt-operator
  namespace: tt-operator-system
set:
  node-feature-discovery.enabled: false
  tt-fabric-manager.enabled: false
  tt-dra-driver.enabled: false
  tt-telemetry.enabled: false
  jobset.enabled: false
  kubepmix.enabled: false
tests:
  - it: renders exactly the controller Deployment
    template: charts/tt-k8s-driver-manager/templates/manager-deployment.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment

  - it: renders the controller + installer RBAC
    template: charts/tt-k8s-driver-manager/templates/manager-rbac.yaml
    asserts:
      - containsDocument:
          kind: ServiceAccount
          apiVersion: v1
      - containsDocument:
          kind: ClusterRole
          apiVersion: rbac.authorization.k8s.io/v1
      - containsDocument:
          kind: ClusterRoleBinding
          apiVersion: rbac.authorization.k8s.io/v1

  - it: forwards the controller image override onto the manager container
    template: charts/tt-k8s-driver-manager/templates/manager-deployment.yaml
    # README-documented override contract: repository + tag (NOT a single
    # `controller.image` string — the subchart indexes .repository/.tag).
    set:
      tt-k8s-driver-manager.controller.image.repository: ghcr.io/tenstorrent/tt-k8s-driver-manager-controller
      tt-k8s-driver-manager.controller.image.tag: contract-test
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/tenstorrent/tt-k8s-driver-manager-controller:contract-test

  - it: forwards the driver + flasher image overrides as controller env vars
    template: charts/tt-k8s-driver-manager/templates/manager-deployment.yaml
    set:
      tt-k8s-driver-manager.driver.image.repository: ghcr.io/tenstorrent/tt-k8s-driver-manager-builder
      tt-k8s-driver-manager.driver.image.tag: contract-test
      tt-k8s-driver-manager.flasher.image.repository: ghcr.io/tenstorrent/tt-k8s-driver-manager-flasher
      tt-k8s-driver-manager.flasher.image.tag: contract-test
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DRIVER_IMAGE
            value: ghcr.io/tenstorrent/tt-k8s-driver-manager-builder:contract-test
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: FLASHER_IMAGE
            value: ghcr.io/tenstorrent/tt-k8s-driver-manager-flasher:contract-test

  - it: renders no controller Deployment when disabled
    template: charts/tt-k8s-driver-manager/templates/manager-deployment.yaml
    set:
      tt-k8s-driver-manager.enabled: false
    asserts:
      - hasDocuments:
          count: 0
