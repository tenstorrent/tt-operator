# yamllint config for tt-operator. Scope: hand-authored YAML (Chart.yaml,
# values.yaml, workflow + composite-action definitions, dev manifests).
# Helm templates are Go-templated text, not valid YAML, so they're excluded.
extends: default

ignore: |
  charts/tt-operator/templates/

rules:
  # Chart.yaml's description is one long intentional line.
  line-length: disable
  # Helm/values files don't lead with a `---` document marker.
  document-start: disable
  # `on:` in workflow files is a key, not a boolean — don't flag it.
  truthy:
    check-keys: false
  # values.yaml aligns prose comment blocks to the values they document.
  comments-indentation: disable
  comments:
    min-spaces-from-content: 1
  indentation:
    spaces: consistent
    indent-sequences: consistent
  # Allow the compact flow style used in dev RBAC manifests, e.g.
  # `roleRef: { apiGroup: ..., kind: ... }` — one space inside the delimiters.
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1
