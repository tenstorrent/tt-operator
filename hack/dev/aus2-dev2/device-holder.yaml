# Synthetic workload that actually holds /dev/tenstorrent/0 open (via shell
# redirect — `exec sleep < /dev/tenstorrent/0` keeps fd 0 open against the
# device for the duration of the sleep). Unlike workload-sample.yaml's busybox
# (which only *mounts* the device path), this pod keeps a real fd open,
# bumping the kernel module's refcount.
#
# Used to validate: what happens when the driver DaemonSet tries to
# modprobe -r tenstorrent while a userspace process holds the device.
apiVersion: v1
kind: Pod
metadata:
  name: tt-device-holder
  namespace: default
  labels:
    app: tt-device-holder
spec:
  nodeSelector:
    kubernetes.io/hostname: e01cs03
  restartPolicy: Always
  containers:
    - name: holder
      image: busybox:1.36
      command: ["sh", "-c", "exec sleep 99999 < /dev/tenstorrent/0"]
      volumeMounts:
        - name: tt
          mountPath: /dev/tenstorrent
      securityContext:
        privileged: true
  volumes:
    - name: tt
      hostPath:
        path: /dev/tenstorrent
