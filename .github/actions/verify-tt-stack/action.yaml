name: Verify tt-fabric-manager + tt-telemetry
description: |
  Now that the operator-driven kmd install has finished and /dev/tenstorrent is
  back, confirm the per-node agents come up: the tt-fabric-manager agent,
  tt-telemetry collector, and tt-dra-driver kubelet plugin DaemonSets reach
  Ready, and tt-telemetry's /metrics endpoint serves Prometheus exposition with
  tt_driver_initialized=1 (the signal that the UMD round-trip to the device
  succeeded).

inputs:
  namespace:
    description: Release namespace.
    default: tt-operator-system

runs:
  using: composite
  steps:
    - name: tt-fabric-manager + tt-telemetry DaemonSets Ready
      shell: bash
      run: |
        set -ex
        NS='${{ inputs.namespace }}'
        kubectl -n "$NS" rollout status ds/tt-fabric-manager-agent --timeout=4m
        kubectl -n "$NS" rollout status ds/tt-telemetry-daemonset --timeout=4m
        # The DRA kubelet plugin also crash-loops before kmd is present. Wait for
        # it to stabilise so its CrashLoopBackOff backoff cannot fire inside the
        # verify-stack-stable observation window and produce a false positive.
        draDS=$(kubectl -n "$NS" get daemonset \
                  -l app.kubernetes.io/name=tt-dra-driver \
                  -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
        if [ -n "$draDS" ]; then
          kubectl -n "$NS" rollout status "ds/$draDS" --timeout=4m
        fi
        kubectl -n "$NS" get pods -l app.kubernetes.io/name=tt-fabric-manager -o wide
        kubectl -n "$NS" get pods -l app=tt-telemetry -o wide

    - name: tt-telemetry /metrics — tt_driver_initialized reaches 1
      shell: bash
      run: |
        set -euo pipefail
        NS='${{ inputs.namespace }}'

        PF_PID=""
        cleanup() {
          if [ -n "$PF_PID" ]; then kill "$PF_PID" 2>/dev/null || true; fi
        }
        trap cleanup EXIT

        # (Re)establish a port-forward to whichever collector pod is current.
        # The collector restarts while it waits for the device — a pre-driver
        # start finds no chips and exits, and UMD init on a multi-chip box is
        # slow — which tears the forward down. So we re-resolve the pod and
        # reconnect rather than assume one long-lived tunnel (a single fixed
        # 30s reachability gate could not survive one CrashLoopBackOff cycle).
        start_pf() {
          cleanup
          PF_PID=""
          local pod
          pod=$(kubectl -n "$NS" get pods -l app=tt-telemetry \
                  -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          [ -n "$pod" ] || return 1
          # Target the port by name: the subchart's listen port is a value
          # (network.telemetryHttpPort) and has changed across releases.
          kubectl -n "$NS" port-forward "pod/$pod" 18080:telemetry-http >/tmp/pf.log 2>&1 &
          PF_PID=$!
          sleep 2
        }

        # One tolerant budget: wait up to 8 min for /metrics to be reachable AND
        # report tt_driver_initialized=1. --noproxy bypasses squid for 127.0.0.1.
        ok=0
        deadline=$(( SECONDS + 480 ))
        start_pf || true
        while [ "$SECONDS" -lt "$deadline" ]; do
          if [ -z "$PF_PID" ] || ! kill -0 "$PF_PID" 2>/dev/null; then
            start_pf || { sleep 5; continue; }
          fi
          if curl -sf --noproxy '*' http://127.0.0.1:18080/metrics >/tmp/metrics.txt 2>/dev/null; then
            if awk '/^tt_driver_initialized([{ ])/ { if ($NF+0 == 1) f=1 } END { exit !f }' /tmp/metrics.txt; then
              ok=1; break
            fi
          else
            # Connection refused usually means the collector just restarted and
            # has not rebound its listen port yet — reconnect and keep waiting.
            start_pf || true
          fi
          sleep 5
        done

        if [ "$ok" -ne 1 ]; then
          echo "::error::timed out waiting for tt-telemetry /metrics tt_driver_initialized=1"
          echo "----- /tmp/pf.log (port-forward) -----"
          cat /tmp/pf.log 2>/dev/null || echo "(no pf.log)"
          echo "----- tail /tmp/metrics.txt -----"
          tail -20 /tmp/metrics.txt 2>/dev/null || echo "(no metrics captured)"
          kubectl -n "$NS" get pods -l app=tt-telemetry -o wide || true
          exit 1
        fi

        grep -E '^tt_driver_initialized' /tmp/metrics.txt | head -5
        grep -qE '^# (HELP|TYPE) ' /tmp/metrics.txt
        echo "OK: tt_driver_initialized=1; /metrics served $(wc -l < /tmp/metrics.txt) lines"

    - name: tt-telemetry /metrics — per-device identity labels present
      shell: bash
      run: |
        set -euo pipefail
        # US-E2: the collector runs without FSD (fabric_manager_address=""), so it
        # monitors Ethernet channels directly. Per-device identity still comes from
        # the PhysicalSystemDescriptor: every device-scoped metric line carries
        # numeric tray="" + chip="" labels (tt-telemetry MetricLabels::TRAY/CHIP,
        # FSD-independent). Assert at least one line carries both — proof the
        # exposition is device-scoped, not just host-level. (tt_driver_initialized
        # itself only has a host-level hostname label, so we don't key on it.)
        # Reuses /tmp/metrics.txt captured by the previous step.
        test -s /tmp/metrics.txt || { echo "::error::/tmp/metrics.txt missing/empty"; exit 1; }
        if awk '/tray="[0-9]+"/ && /chip="[0-9]+"/ { c++ } END { exit (c?0:1) }' /tmp/metrics.txt; then
          echo "OK: /metrics carries per-device identity (tray/chip) labels; samples:"
          awk '/tray="[0-9]+"/ && /chip="[0-9]+"/ { print; if (++c>=3) exit }' /tmp/metrics.txt
        else
          echo "::error::no per-device (tray/chip) labelled metric line found in /metrics"
          grep -E '^tt_' /tmp/metrics.txt | head -20 || true
          exit 1
        fi
