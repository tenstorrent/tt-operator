name: Release Helm Chart

# AUTH NOTE (interim): pulling and pushing use DIFFERENT credentials.
#
# - PULL  (helm dependency build of the tt-k8s-driver-manager subchart):
#   tt-operator's GITHUB_TOKEN doesn't have cross-repo read on the
#   driver-manager-linked GHCR package. Until an org admin grants access
#   ("Manage Actions access → add tt-operator → Read" on the 4 packages),
#   we authenticate the pull with the GHCR_PULL_PAT repo secret. Mirrors
#   ci.yaml's pattern.
#
# - PUSH  (helm push of the umbrella chart to ghcr.io/.../helm-charts):
#   the published artifact lands in tt-operator's own namespace, where
#   GITHUB_TOKEN already has write — keep using it. PATs we set up have
#   read scope only.
#
# `helm registry login` overwrites credentials in its single store, so we
# log in twice: with the PAT before dep build, then re-login with
# GITHUB_TOKEN before package + push.
#
# TODO: collapse back to a single GITHUB_TOKEN login once cross-repo
# package access is granted.

on:
  pull_request:
    paths:
      - charts/**
      - .github/**
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      # helm dependency build pulls one HTTP repo (NFD) and one OCI repo
      # (tenstorrent/helm-charts for tt-k8s-driver-manager). HTTP repos need
      # to be registered first; OCI repos are used directly.
      - name: Register chart dependency repos
        run: |
          helm repo add node-feature-discovery https://kubernetes-sigs.github.io/node-feature-discovery/charts
          helm repo update

      # See TODO at top of this file — using GHCR_PULL_PAT instead of
      # GITHUB_TOKEN until proper cross-repo access is granted on the four
      # driver-manager packages. Mirrors ci.yaml's pattern.
      - name: Log in to GHCR (for OCI subchart pulls)
        run: |
          echo "${{ secrets.GHCR_PULL_PAT }}" | \
            helm registry login ghcr.io --username kluongTT --password-stdin

      - name: Build dependencies
        run: helm dependency build charts/tt-operator

      - name: Lint
        run: helm lint charts/tt-operator

  publish:
    needs: lint
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Register chart dependency repos
        run: |
          helm repo add node-feature-discovery https://kubernetes-sigs.github.io/node-feature-discovery/charts
          helm repo update

      # See AUTH NOTE at top of file. Two-step login: PAT for the
      # cross-repo subchart PULL, then GITHUB_TOKEN for the same-repo
      # chart PUSH.
      - name: Log in to GHCR with PAT (for OCI subchart pulls)
        run: |
          echo "${{ secrets.GHCR_PULL_PAT }}" | \
            helm registry login ghcr.io --username kluongTT --password-stdin

      - name: Build dependencies
        run: helm dependency build charts/tt-operator

      # Generates a chart version that's either:
      #   - the v*.*.* tag being pushed (stable release), or
      #   - <next-patch>-<run>.sha-<short> (pre-release on every push to main).
      # Chart.yaml's `version: 0.0.0` is a sentinel that the next step
      # rewrites before packaging.
      - name: Generate chart version
        id: chart
        uses: ./.github/actions/version

      - name: Stamp Chart.yaml with generated version
        working-directory: charts/tt-operator
        run: |
          sed -i "s/^version:.*/version: ${{ steps.chart.outputs.version }}/" Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.chart.outputs.version }}\"/" Chart.yaml

      - name: Re-login with GITHUB_TOKEN (for umbrella chart push)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package and push
        run: |
          helm package charts/tt-operator --destination /tmp/helm-packages
          helm push \
            /tmp/helm-packages/tt-operator-${{ steps.chart.outputs.version }}.tgz \
            oci://ghcr.io/${{ github.repository_owner }}/helm-charts
