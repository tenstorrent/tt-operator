name: Release Helm Chart

# TODO (cross-repo OCI auth): the `helm dependency build` steps below pull
# the tt-k8s-driver-manager subchart, which is a GHCR package linked to
# the tt-k8s-driver-manager repo. tt-operator's GITHUB_TOKEN does NOT have
# auto-grant read access on it — same problem ci.yaml works around with
# GHCR_PULL_PAT. This workflow currently still uses GITHUB_TOKEN because
# it only runs on push-to-main / workflow_dispatch and hasn't run yet.
# Before merging this branch to main, EITHER:
#   1. Get an org admin to grant tt-operator read access on the 4 driver-
#      manager packages (preferred), OR
#   2. Swap the two `secrets.GITHUB_TOKEN` references for OCI auth below
#      to `secrets.GHCR_PULL_PAT` and username to `kluongTT`, mirroring
#      ci.yaml's interim pattern.
# The chart-push at the bottom keeps GITHUB_TOKEN — the published chart
# (helm-charts/tt-operator) lands in tt-operator's own namespace so the
# default token already has write.

on:
  pull_request:
    paths:
      - charts/**
  push:
    branches:
      - main
    paths:
      - charts/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      # helm dependency build pulls one HTTP repo (NFD) and one OCI repo
      # (tenstorrent/helm-charts for tt-k8s-driver-manager). HTTP repos need
      # to be registered first; OCI repos are used directly.
      - name: Register chart dependency repos
        run: |
          helm repo add node-feature-discovery https://kubernetes-sigs.github.io/node-feature-discovery/charts
          helm repo update

      # See TODO at top of this file — using GHCR_PULL_PAT instead of
      # GITHUB_TOKEN until proper cross-repo access is granted on the four
      # driver-manager packages. Mirrors ci.yaml's pattern.
      - name: Log in to GHCR (for OCI subchart pulls)
        run: |
          echo "${{ secrets.GHCR_PULL_PAT }}" | \
            helm registry login ghcr.io --username kluongTT --password-stdin

      - name: Build dependencies
        run: helm dependency build charts/tt-operator

      - name: Lint
        run: helm lint charts/tt-operator

  publish:
    needs: lint
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Register chart dependency repos
        run: |
          helm repo add node-feature-discovery https://kubernetes-sigs.github.io/node-feature-discovery/charts
          helm repo update

      - name: Log in to GHCR (for OCI subchart pulls + chart push)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build dependencies
        run: helm dependency build charts/tt-operator

      - name: Extract chart version
        id: chart
        run: |
          VERSION=$(grep '^version:' charts/tt-operator/Chart.yaml | awk '{print $2}')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package and push
        run: |
          helm package charts/tt-operator --destination /tmp/helm-packages
          helm push \
            /tmp/helm-packages/tt-operator-${{ steps.chart.outputs.version }}.tgz \
            oci://ghcr.io/${{ github.repository_owner }}/helm-charts
