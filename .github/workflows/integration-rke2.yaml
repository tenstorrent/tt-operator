name: integration-rke2

# Full end-to-end integration test on Tenstorrent hardware runners (ephemeral
# KVM VMs with a TT card passed through via VFIO and tt-kmd preloaded). Stands
# up a single-node RKE2 cluster, installs the umbrella, and drives the operator
# through a real tt-kmd reinstall, then verifies fabric-manager + telemetry +
# DRA. The VM is destroyed at job end, so each run gets a fresh kernel +
# /dev/tenstorrent. Matrixed across the p150b (Blackhole) and n300-llmbox
# (Wormhole, vIOMMU) runner pools — same code path, different hardware.
#
# Companion to integration-kind.yaml (which fakes the NFD label and only
# reaches image-pull); this is the real-hardware tier.
#
# Modular by design: each phase is a composite action under .github/actions/,
# so adding a check is a new composite + one `uses:` line below.
#
# AUTH NOTE: the tt-k8s-driver-manager OCI subchart + private images are pulled
# with the GHCR_PULL_PAT secret (GITHUB_TOKEN lacks cross-repo package read).
# See the helm-deps action for the canonical note. TODO: drop once granted.

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/actions/**"
      - ".github/workflows/integration-rke2.yaml"
  pull_request:
    paths:
      - "charts/**"
      - ".github/actions/**"
      - ".github/workflows/integration-rke2.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: integration-rke2-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  install-on-rke2:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - tt-ubuntu-2204-p150b-stable
          - tt-ubuntu-2204-n300-llmbox-viommu-stable
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.runner }}
    # Bumped from 30: the driver-upgrade phase adds two more DKMS builds (to 2.8.0,
    # then restore to the preloaded version) on top of the initial install build.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Pre-flight — runner introspection
        id: preflight
        uses: ./.github/actions/tt-runner-preflight

      - name: Remove preloaded tt-kmd (incl. DKMS)
        uses: ./.github/actions/remove-tt-kmd

      - name: Set up RKE2 cluster
        uses: ./.github/actions/setup-rke2-cluster

      - name: Build chart deps (GHCR login + helm dep build)
        uses: ./.github/actions/helm-deps
        with:
          ghcr-password: ${{ secrets.GHCR_PULL_PAT }}

      - name: Stage namespace + GHCR pull secret
        uses: ./.github/actions/ghcr-pull-secret
        with:
          ghcr-password: ${{ secrets.GHCR_PULL_PAT }}

      - name: Generate install values (proxy + pull secrets)
        id: vals
        uses: ./.github/actions/rke2-install-values

      - name: Install umbrella
        uses: ./.github/actions/install-tt-operator
        with:
          values-file: ${{ steps.vals.outputs.values-file }}

      - name: Verify install landed
        uses: ./.github/actions/verify-install

      - name: Driver install via TenstorrentDriverPolicy
        uses: ./.github/actions/driver-policy-install
        with:
          kmd-version: ${{ steps.preflight.outputs.kmd-version }}

      - name: Verify tt-fabric-manager + tt-telemetry
        uses: ./.github/actions/verify-tt-stack

      # With the device up and telemetry settled, assert the operands stop
      # flapping (tolerates the collector's expected pre-driver crash-loop).
      - name: Stack is stable (no new restarts)
        uses: ./.github/actions/verify-stack-stable

      - name: DRA claim smoke
        # Non-gating: tt-dra-driver#14 (retry GetTopology on NOT_DISCOVERED)
        # landed 2026-06-16 and ships in the pinned 0.0.31, so the old
        # empty-ResourceSlice bug is fixed — but the claim still can't allocate
        # on a runner with no staged fabric topology. Kept continue-on-error
        # until a topology-equipped runner confirms a green allocation.
        continue-on-error: true
        uses: ./.github/actions/dra-smoke

      # Real in-place driver upgrade (from -> 2.8.0 -> restore) + telemetry
      # quiesce assertion. Last, because it churns the device (telemetry/DRA
      # disruption is expected) and restores the preloaded version at the end.
      - name: Driver upgrade + telemetry quiesce
        uses: ./.github/actions/driver-policy-upgrade
        with:
          from-version: ${{ steps.preflight.outputs.kmd-version }}
          to-version: "2.8.0"

      # US-A4: with the kmd restored (module loaded), disable the driver
      # manager in place and prove the device(s) stay allocatable without it.
      # Last, because it permanently reconfigures the release (VM is torn down
      # at job end anyway).
      - name: Pre-installed-driver mode (device persists without the manager)
        uses: ./.github/actions/verify-preinstalled-driver

      - name: Diagnostics on failure
        if: failure()
        uses: ./.github/actions/integration-failure-diagnostics
