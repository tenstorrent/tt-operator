name: ci

# tt-operator is an umbrella chart now (no Go code). CI lints + renders
# the chart, and stands up a kind cluster to smoke-test `helm install`.
#
# AUTH NOTE (temporary): the `tt-k8s-driver-manager` chart and container
# images are GHCR packages linked to the tt-k8s-driver-manager repo, and
# `tenstorrent/tt-operator`'s GITHUB_TOKEN is NOT auto-granted cross-repo
# read access. Until an admin clicks "Manage Actions access → add
# tt-operator → Read" on those 4 package settings pages, we authenticate
# pulls with a personal PAT stored in the `GHCR_PULL_PAT` repo secret
# (read:packages, SSO-authorized to tenstorrent).
# TODO: revert to secrets.GITHUB_TOKEN here once package access is granted.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      # See AUTH NOTE at top of file — using GHCR_PULL_PAT instead of
      # GITHUB_TOKEN here until proper cross-repo access is granted.
      - name: Log in to GHCR (for OCI subchart pulls)
        run: |
          echo "${{ secrets.GHCR_PULL_PAT }}" | \
            helm registry login ghcr.io --username kluongTT --password-stdin

      - name: Register chart dependency repos
        run: |
          helm repo add node-feature-discovery https://kubernetes-sigs.github.io/node-feature-discovery/charts
          helm repo update

      - name: Helm lint
        run: |
          helm dependency build charts/tt-operator
          helm lint charts/tt-operator

      - name: Helm template render
        run: helm template charts/tt-operator > /tmp/rendered.yaml

  # Stands up a 1-node kind, installs the umbrella against it, and checks
  # that nothing trips on image pulls or required-values. This is what
  # catches bugs `helm lint` and `helm template` happily render past — most
  # commonly: subchart image overrides that reference a tag or repo name
  # that doesn't exist in GHCR (which would ImagePullBackOff a real cluster
  # install). NFD is disabled and we stamp the PCI-presence label by hand
  # so the driver DaemonSet schedules without real Tenstorrent hardware.
  smoke-install:
    needs: helm-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      # Creates the kind cluster, logs in to GHCR (PAT), side-loads the
      # driver-manager images at the Chart.yaml-pinned tag, fakes the NFD
      # tt-present label, and builds chart deps. See the action's own file
      # for the full rationale + AUTH NOTE. Shared with the integration job.
      - name: Bootstrap kind + chart deps
        uses: ./.github/actions/kind-bootstrap
        with:
          cluster-name: tt-smoke
          ghcr-password: ${{ secrets.GHCR_PULL_PAT }}

      - name: helm install
        # Disable subcharts whose prereqs aren't in kind: NFD (we fake
        # the tt-present label by hand), kubepmix (needs cert-manager),
        # tt-fabric-manager (needs cluster-specific config), tt-dra-driver
        # (needs k8s 1.33 + DRA feature gate + TTFM).
        run: |
          helm install tt-operator charts/tt-operator \
            -n tt-operator-system --create-namespace \
            --set node-feature-discovery.enabled=false \
            --set kubepmix.enabled=false \
            --set tt-fabric-manager.enabled=false \
            --set tt-dra-driver.enabled=false \
            --set tt-telemetry.enabled=false

      - name: Controller Deployment becomes Ready
        # helm install returns before its resources are materialized in the
        # API. A short settle delay lets the controller deployment appear,
        # then we wait for every Deployment in the namespace to be Available
        # — NFD is disabled, so the only deployment is the controller.
        run: |
          sleep 10
          kubectl -n tt-operator-system get deployments
          kubectl -n tt-operator-system wait --for=condition=Available --timeout=3m deployments --all

      - name: No ImagePullBackOff anywhere in the namespace
        # The actual bug class this smoke test exists to catch: values.yaml
        # references an image that doesn't exist. We let the DS try to
        # schedule + pull, then assert no container is wedged on a missing
        # image. The DS pod itself may CrashLoop later (kernel headers
        # absent in kind) — that's OK; we only police image pulls here.
        run: |
          sleep 30
          waiting=$(kubectl get pods -n tt-operator-system -o json | \
            jq -r '[.items[].status.containerStatuses[]?.state.waiting.reason] | map(select(. != null)) | join(",")')
          echo "Waiting reasons across namespace: $waiting"
          if echo "$waiting" | grep -Eq "ImagePullBackOff|ErrImagePull"; then
            echo "FAIL: missing image somewhere"
            exit 1
          fi
          echo "OK"

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl describe pods -n tt-operator-system
          kubectl get events -n tt-operator-system --sort-by=.lastTimestamp | tail -40
